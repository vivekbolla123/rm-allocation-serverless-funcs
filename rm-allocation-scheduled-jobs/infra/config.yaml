# Infrastructure-as-Code Configuration for rm-allocation-scheduled-jobs
# Modify this file to update sizing, environment variables, or triggers.
# Run 'python infra.py --env <uat|prod> --plan' to preview changes.

version: '1.0'
service_name: rm-allocation-scheduled-jobs
description: Scheduled jobs orchestrator for RM dynamic allocation
defaults:
  memory: 4096
  timeout: 900
  ephemeral_storage: 4096
  dd_service: rm-scheduled-jobs
  dd_version: latest
  log_retention_days: 30
environments:
  uat:
    account_id: '891377165721'
    region: ap-south-1
    execution_role_arn: arn:aws:iam::891377165721:role/lambda-execution-role
    lambda:
      name: uat-rm-lambda-rm-allocation-scheduled-jobs
      image_uri: 891377165721.dkr.ecr.ap-south-1.amazonaws.com/uat-rm-ecr-rm-allocation-scheduled-jobs:latest
      memory: 4096
      timeout: 900
      ephemeral_storage: 4096
      dd_service: rm-scheduled-jobs
      dd_version: latest
      log_retention_days: 30
      env_vars: {}
    vpc:
      vpc_id: vpc-01452dce7b5b446e1
      subnets:
      - subnet-053e2b8d03017c388
      - subnet-0a05a901a38cd5672
      security_groups:
      - sg-087f8184f725ec3fe
    secrets:
      dd_api_key_ssm: /copilot/qp/uat/secrets/DD_API_KEY
    triggers:
      sqs:
        queue_name: test
        batch_size: 10
        enabled: false
        max_concurrency: 500
      rules:
      - name: QCProcess
        schedule: cron(30 17 ? * sat *)
        enabled: false
        description: Create min max table for historic and profile fares
        input:
          body:
            modules:
              gen_qc_fares_table: 1
      - name: QC_Check
        schedule: cron(30 17 ? * sun *)
        enabled: false
        description: Compare and check minMax tables with the original fares tables
        input:
          body:
            modules:
              qc_fares_check: 1
      - name: connections
        schedule: cron(*/15 * ? * * *)
        enabled: false
        description: all
        input:
          body:
            modules:
              mark_run_completed: 1
              sftp_push: 1
              connections: 1
      - name: daily_rolling
        schedule: cron(0 17 ? * MON-FRI *)
        enabled: false
        input:
          body:
            modules:
              daily_rolling: 1
      - name: noshowprobs
        schedule: rate(5 hours)
        enabled: false
        description: noshowprobs
        input:
          body:
            modules:
              noShowProb: 1
      - name: rm-allocation-report-gen
        schedule: cron(*/5 * ? * * *)
        enabled: true
        description: Report Generation
        input:
          body:
            modules:
              alloc_summary: 1
      - name: rm-allocation-sftp-error
        schedule: cron(0/5 * ? * * *)
        enabled: true
        description: sftp error rate
        input:
          body:
            modules:
              sftp_error: 1
              sftp_push: 1
      - name: run_paused_runs
        schedule: cron(*/5 * ? * * *)
        enabled: false
        input:
          body:
            modules:
              run_paused_runs: 1
      - name: schd_run_fail_alert
        schedule: cron(0 * ? * * *)
        enabled: false
        input:
          body:
            modules:
              schd_run_fail_alert: 1
      - name: uat-check-adhocs-queue
        schedule: cron(0/3 * ? * * *)
        enabled: true
        input:
          body:
            modules:
              run_adhocs_queue: 1
      - name: uat-rm-imp-forecast
        schedule: cron(0 * * * ? *)
        enabled: true
        input:
          body:
            modules:
              imputed_forecast: 1
  prod:
    account_id: '471112573018'
    region: ap-south-1
    execution_role_arn: ''
    lambda:
      name: prod-rm-lambda-rm-allocation-scheduled-jobs
      image_uri: 471112573018.dkr.ecr.ap-south-1.amazonaws.com/prod-rm-ecr-rm-allocation-scheduled-jobs:latest
      memory: 4096
      timeout: 900
      ephemeral_storage: 4096
      dd_service: rm-scheduled-jobs
      dd_version: latest
      log_retention_days: 90
      env_vars: {}
    vpc:
      vpc_id: vpc-07b9a52de9cb71261
      subnets:
      - subnet-0123456789abcdef0
      - subnet-0123456789abcdef1
      security_groups:
      - sg-0123456789abcdef0
    secrets:
      dd_api_key_ssm: /copilot/qp/prod/secrets/DD_API_KEY
    triggers:
      sqs:
        queue_name: rm-allocation-queues_rm-allocation-scheduled-jobs
        batch_size: 1
        enabled: true
        max_concurrency: 5
        batching_window_seconds: 1
      rules:
      - name: CalendarUpdate
        schedule: cron(40 18 * * ? *)
        enabled: true
        input:
          body:
            modules:
              update_calendar: 1
      - name: NoShows
        schedule: cron(30 20 * * ? *)
        enabled: true
        input:
          body:
            overrides:
              start_time: 2
              end_time: 3
            modules:
              expected_no_shows: 1
      - name: NoShows2
        schedule: cron(30 9 * * ? *)
        enabled: true
        input:
          body:
            overrides:
              start_time: 15
              end_time: 23
            modules:
              expected_no_shows: 1
      - name: input_audits
        schedule: cron(30 3 1 * ? *)
        enabled: true
        input:
          body:
            modules:
              input_audits: 1
      - name: rm-allocation-active-sectors
        schedule: cron(40 18 * * ? *)
        enabled: true
        input:
          body:
            modules:
              active_sectors: 1
      - name: rm-allocation-forecast-date-config
        schedule: cron(30 0 * * ? *)
        enabled: true
        input:
          body:
            modules:
              forecast_date_config: 1
      - name: rm-allocation-ml-forecast-score
        schedule: cron(0 3 * * ? *)
        enabled: true
        input:
          body:
            modules:
              ml_forecast_score: 1
      - name: rm-allocation-report-gen
        schedule: cron(5,20,35,50 * ? * * *)
        enabled: true
        input:
          body:
            modules:
              alloc_summary: 1
      - name: rm-allocation-scheduled-jobs-navods_alert
        schedule: cron(0 */2 * * ? *)
        enabled: true
        input:
          body:
            modules:
              navods_alert: 1
      - name: rm-allocation-sftp-error
        schedule: cron(55,25 0/1 ? * * *)
        enabled: true
        input:
          body:
            modules:
              sftp_error: 1
      - name: rm-calendar-upsell
        schedule: cron(30 20 L * ? *)
        enabled: false
        input:
          body:
            modules:
              calendar_upsell: 1
      - name: rm-cleanup-schedule
        schedule: cron(0 0 ? * * *)
        enabled: true
        input:
          body:
            modules:
              clean_up: 1
      - name: rm-cug-report
        schedule: cron(30 3 * * ? *)
        enabled: false
        description: rm-cug-report
        input:
          body:
            modules:
              cug_report: 1
      - name: rm-daily-rolling-schedule
        schedule: cron(30 21 ? * * *)
        enabled: true
        input:
          body:
            modules:
              daily_rolling: 1
      - name: rm-execute-queued-adhoc-runs
        schedule: cron(*/6 * ? * * *)
        enabled: true
        input:
          body:
            modules:
              run_adhocs_queue: 1
      - name: rm-resume-runs
        schedule: cron(*/5 * ? * * *)
        enabled: true
        description: rm-resume-runs
        input:
          body:
            modules:
              run_paused_runs: 1
      - name: rm-run-failure-alert
        schedule: cron(0 * * * ? *)
        enabled: true
        input:
          body:
            modules:
              schd_run_fail_alert: 1
      - name: rm-schedule-thirty
        schedule: cron(30 16 * * ? *)
        enabled: true
        description: Executing NDO 30+ flights
        input:
          body:
            modules:
              schedule_thirty: 1
      - name: rm-scheduled-eqt-change
        schedule: cron(0/15 * * * ? *)
        enabled: true
        input:
          body:
            modules:
              eqt_alloc: 1
      - name: rm-scheduled-jobs-fare-autorefresh
        schedule: cron(0 21 ? * SUN *)
        enabled: false
        input:
          body:
            modules:
              fares: 1
      - name: rm-scheduled-jobs-fetchactiveflights
        schedule: cron(30 1 * * ? *)
        enabled: true
        input:
          body:
            modules:
              fetchactiveflights: 1
      - name: rm-scheduled-jobs-noshow-probability
        schedule: cron(30 16 ? * SUN *)
        enabled: true
        input:
          body:
            modules:
              noShowProb: 1
      - name: rm-scheduled-jobs-schedule
        schedule: cron(*/15 * ? * * *)
        enabled: true
        input:
          body:
            modules:
              sftp_push: 1
              mark_run_completed: 1
      - name: rm-scheduled-report-audits
        schedule: cron(40 18 * * ? *)
        enabled: true
        input:
          body:
            modules:
              input_audits: 1
      - name: rm-scheduled-saleinv-baseload
        schedule: cron(0 18 1 * ? *)
        enabled: true
        input:
          body:
            modules:
              saleinv_baseload: 1
      - name: rm-update-imputed-forecast
        schedule: cron(0 * * * ? *)
        enabled: true
        input:
          body:
            modules:
              imputed_forecast: 1
      schedules:
      - name: QCcheck
        schedule: cron(0 10 1 * ? *)
        timezone: Asia/Calcutta
        enabled: false
        description: Range Check
        input:
          body:
            modules:
              qc_fares_check: 1
      - name: RMScheduleJob_ML_Forecast_Score_International
        schedule: cron(30 8 * * ? *)
        timezone: Asia/Calcutta
        enabled: true
        input:
          body:
            modules:
              ml_forecast_score_international: 1
      - name: RMScheduleJob_DefaultMarketListRefresh_0_60
        schedule: cron(0 1 ? * 3,5,6 *)
        timezone: Asia/Calcutta
        enabled: true
        input:
          body:
            overrides:
              start_day: 0
              end_day: 60
            modules:
              default_ml: 1
      - name: QCprocess
        schedule: cron(0 10 L * ? *)
        timezone: Asia/Calcutta
        enabled: false
        description: Generating Tables
        input:
          body:
            modules:
              gen_qc_fares_table: 1
      - name: RMScheduleJob_DefaultMarketListRefresh_0_180
        schedule: cron(0 1 ? * 2,4,7 *)
        timezone: Asia/Calcutta
        enabled: true
        input:
          body:
            overrides:
              start_day: 0
              end_day: 180
            modules:
              default_ml: 1
      - name: RMScheduleJob_DefaultMarketListRefresh_0_365
        schedule: cron(0 2 ? * 1 *)
        timezone: Asia/Calcutta
        enabled: true
        input:
          body:
            overrides:
              start_day: 0
              end_day: 365
            modules:
              default_ml: 1
      - name: RMScheduleJob_HoldBookingAlert
        schedule: rate(15 minutes)
        timezone: Asia/Calcutta
        enabled: true
        input:
          body:
            modules:
              hold_booking_alert: 1
