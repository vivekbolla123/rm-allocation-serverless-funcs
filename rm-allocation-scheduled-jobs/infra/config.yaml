# Infrastructure-as-Code Configuration for rm-allocation-scheduled-jobs
# Modify this file to update sizing, environment variables, or triggers.
# Run 'python infra.py --env <uat|prod> --plan' to preview changes.

version: '1.0'
service_name: rm-allocation-scheduled-jobs
description: Scheduled jobs orchestrator for RM dynamic allocation
defaults:
  memory: 4096
  timeout: 900
  ephemeral_storage: 4096
  dd_service: rm-scheduled-jobs
  dd_version: latest
  log_retention_days: 30
environments:
  uat:
    account_id: '891377165721'
    region: ap-south-1
    execution_role_arn: arn:aws:iam::891377165721:role/lambda-execution-role
    lambda:
      name: uat-rm-lambda-rm-allocation-scheduled-jobs
      image_uri: 891377165721.dkr.ecr.ap-south-1.amazonaws.com/uat-rm-ecr-rm-allocation-scheduled-jobs:latest
      memory: 4096
      timeout: 900
      ephemeral_storage: 4096
      dd_service: rm-scheduled-jobs
      dd_version: latest
      log_retention_days: 30
      env_vars: {}
    vpc:
      vpc_id: vpc-01452dce7b5b446e1
      subnets:
      - subnet-053e2b8d03017c388
      - subnet-0a05a901a38cd5672
      security_groups:
      - sg-087f8184f725ec3fe
    secrets:
      dd_api_key_ssm: /copilot/qp/uat/secrets/DD_API_KEY
    triggers:
      sqs:
        queue_name: test
        batch_size: 10
        enabled: false
        max_concurrency: 500
      rules:
      - name: QCProcess
        schedule: cron(30 17 ? * sat *)
        enabled: false
        description: Create min max table for historic and profile fares
        input:
          body:
            modules:
              gen_qc_fares_table: 1
      - name: QC_Check
        schedule: cron(30 17 ? * sun *)
        enabled: false
        description: Compare and check minMax tables with the original fares tables
        input:
          body:
            modules:
              qc_fares_check: 1
      - name: connections
        schedule: cron(*/15 * ? * * *)
        enabled: false
        description: all
        input:
          body:
            modules:
              mark_run_completed: 1
              sftp_push: 1
              connections: 1
      - name: daily_rolling
        schedule: cron(0 17 ? * MON-FRI *)
        enabled: false
        input:
          body:
            modules:
              daily_rolling: 1
      - name: noshowprobs
        schedule: rate(5 hours)
        enabled: false
        description: noshowprobs
        input:
          body:
            modules:
              noShowProb: 1
      - name: rm-allocation-report-gen
        schedule: cron(*/5 * ? * * *)
        enabled: true
        description: Report Generation
        input:
          body:
            modules:
              alloc_summary: 1
      - name: rm-allocation-sftp-error
        schedule: cron(0/5 * ? * * *)
        enabled: true
        description: sftp error rate
        input:
          body:
            modules:
              sftp_error: 1
              sftp_push: 1
      - name: run_paused_runs
        schedule: cron(*/5 * ? * * *)
        enabled: false
        input:
          body:
            modules:
              run_paused_runs: 1
      - name: schd_run_fail_alert
        schedule: cron(0 * ? * * *)
        enabled: false
        input:
          body:
            modules:
              schd_run_fail_alert: 1
      - name: uat-check-adhocs-queue
        schedule: cron(0/3 * ? * * *)
        enabled: true
        input:
          body:
            modules:
              run_adhocs_queue: 1
      - name: uat-rm-imp-forecast
        schedule: cron(0 * * * ? *)
        enabled: true
        input:
          body:
            modules:
              imputed_forecast: 1
