AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 1 - Lambda Level Creation Stack
  Provisions all 9 new RM Lambda functions with container packaging (ECR),
  IAM execution roles, CloudWatch log groups, VPC configuration, Ephemeral storage,
  and Datadog serverless monitoring extensions.

Parameters:
  Environment:
    Type: String
    AllowedValues: [uat, prod]
    Default: uat
    Description: Deployment target environment (uat or prod).

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Lambda functions will be attached for DB/private connectivity.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda VPC configuration.

  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group IDs permitting database/cache access.

  ExistingExecutionRoleArn:
    Type: String
    Default: ''
    Description: Optional existing IAM role ARN. If empty, a dedicated least-privilege role is created.

  DatadogApiKeySsmPath:
    Type: String
    Default: '/copilot/qp/uat/secrets/DD_API_KEY'
    Description: SSM Parameter store path containing the Datadog API key.

  ImageTag:
    Type: String
    Default: 'latest'
    Description: ECR Docker image tag to deploy for all services.

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch log retention period in days.

Conditions:
  CreateIamRole: !Equals [!Ref ExistingExecutionRoleArn, '']
  IsProd: !Equals [!Ref Environment, 'prod']

Mappings:
  ServiceSpecs:
    rm-additive-process:
      MemorySize: 4096
      Timeout: 900
      EphemeralStorage: 2048
      DdService: rm-additive-process
    rm-additive-prefetch:
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: 2048
      DdService: rm-additive-process
    rm-allocation-fetch-inputs:
      MemorySize: 8192
      Timeout: 900
      EphemeralStorage: 1600
      DdService: rm-fetch-inputs
    rm-allocation-prefetch-inputs:
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: 4096
      DdService: rm-prefetch-inputs
    rm-allocation-process-inputs:
      MemorySize: 8192
      Timeout: 900
      EphemeralStorage: 1600
      DdService: rm-process-inputs
    rm-allocation-scheduled-jobs:
      MemorySize: 4096
      Timeout: 900
      EphemeralStorage: 4096
      DdService: rm-scheduled-jobs
    rm-allocation-update-rbd:
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: 4096
      DdService: rm-update-rbd
    rm-allocation-update-rbd-ftp:
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: 4096
      DdService: rm-update-rbd-ftp
    rm-pricing-triggers:
      MemorySize: 4096
      Timeout: 900
      EphemeralStorage: 4096
      DdService: rm-pricing-tiggers

Resources:
  # =========================================================================
  # IAM Execution Role (Created if ExistingExecutionRoleArn is omitted)
  # =========================================================================
  LambdaDefaultExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateIamRole
    Properties:
      RoleName: !Sub "${Environment}-rm-lambda-common-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RmLambdaCorePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/copilot/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - "arn:aws:s3:::*qp-applications*"
                  - "arn:aws:s3:::*qp-applications*/*"
                  - "arn:aws:s3:::*qp-s3-fs*"
                  - "arn:aws:s3:::*qp-s3-fs*/*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"

  # =========================================================================
  # CloudWatch Log Groups for All 9 Functions
  # =========================================================================
  LogGroupAdditiveProcess:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-additive-process"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupAdditivePrefetch:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-additive-prefetch"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupFetchInputs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-allocation-fetch-inputs"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupPrefetchInputs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-allocation-prefetch-inputs"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupProcessInputs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-allocation-process-inputs"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupScheduledJobs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-allocation-scheduled-jobs"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupUpdateRbd:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-allocation-update-rbd"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupUpdateRbdFtp:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-allocation-update-rbd-ftp"
      RetentionInDays: !Ref LogRetentionInDays

  LogGroupPricingTriggers:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-rm-lambda-rm-pricing-triggers"
      RetentionInDays: !Ref LogRetentionInDays

  # =========================================================================
  # Lambda Functions (Container Image PackageType)
  # =========================================================================
  # 1. rm-additive-process
  FunctionAdditiveProcess:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupAdditiveProcess
    Properties:
      FunctionName: !Sub "${Environment}-rm-lambda-rm-additive-process"
      Description: "Additive process lambda handler for RM additive model"
      PackageType: Image
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Environment}-rm-ecr-rm-additive-process:${ImageTag}"
      Role: !If [CreateIamRole, !GetAtt LambdaDefaultExecutionRole.Arn, !Ref ExistingExecutionRoleArn]
      Timeout: !FindInMap [ServiceSpecs, rm-additive-process, Timeout]
      MemorySize: !FindInMap [ServiceSpecs, rm-additive-process, MemorySize]
      EphemeralStorage:
        Size: !FindInMap [ServiceSpecs, rm-additive-process, EphemeralStorage]
      Architectures: [x86_64]
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          env: !Ref Environment
          DD_LAMBDA_HANDLER: "lambda_function.lambda_handler"
          DD_SITE: "datadoghq.com"
          DD_ENV: !Ref Environment
          DD_SERVICE: !FindInMap [ServiceSpecs, rm-additive-process, DdService]
          DD_VERSION: !Ref ImageTag
          DD_TRACE_ENABLED: "true"
          DD_DATA_STREAMS_ENABLED: "true"
          DD_SERVERLESS_LOGS_ENABLED: "true"
          DD_LOGS_INJECTION: "true"
          DD_COLD_START_TRACING: "false"
          DD_TAGS: !Sub "env:${Environment},service:rm-additive-process,Department:RM,team:RM"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: rm-additive-process
        - Key: Department
          Value: RM
        - Key: ManagedBy
          Value: CloudFormation

  # 2. rm-additive-prefetch
  FunctionAdditivePrefetch:
