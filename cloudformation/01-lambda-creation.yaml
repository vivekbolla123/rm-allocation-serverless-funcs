# =========================================================================
# Outputs (Exported for Activation and Downstream Stacks)
# =========================================================================
Outputs:
  ExecutionRoleArn:
    Description: IAM Execution Role used across the functions
    Value: !If [CreateIamRole, !GetAtt LambdaDefaultExecutionRole.Arn, !Ref ExistingExecutionRoleArn]
    Export:
      Name: !Sub "${AWS::StackName}-ExecutionRoleArn"

  AdditiveProcessArn:
    Description: ARN of rm-additive-process
    Value: !GetAtt FunctionAdditiveProcess.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-additive-process"

  AdditivePrefetchArn:
    Description: ARN of rm-additive-prefetch
    Value: !GetAtt FunctionAdditivePrefetch.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-additive-prefetch"

  FetchInputsArn:
    Description: ARN of rm-allocation-fetch-inputs
    Value: !GetAtt FunctionFetchInputs.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-allocation-fetch-inputs"

  PrefetchInputsArn:
    Description: ARN of rm-allocation-prefetch-inputs
    Value: !GetAtt FunctionPrefetchInputs.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-allocation-prefetch-inputs"

  ProcessInputsArn:
    Description: ARN of rm-allocation-process-inputs
    Value: !GetAtt FunctionProcessInputs.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-allocation-process-inputs"

  ScheduledJobsArn:
    Description: ARN of rm-allocation-scheduled-jobs
    Value: !GetAtt FunctionScheduledJobs.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-allocation-scheduled-jobs"

  UpdateRbdArn:
    Description: ARN of rm-allocation-update-rbd
    Value: !GetAtt FunctionUpdateRbd.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-allocation-update-rbd"

  UpdateRbdFtpArn:
    Description: ARN of rm-allocation-update-rbd-ftp
    Value: !GetAtt FunctionUpdateRbdFtp.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-allocation-update-rbd-ftp"

  PricingTriggersArn:
    Description: ARN of rm-pricing-triggers
    Value: !GetAtt FunctionPricingTriggers.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn-rm-pricing-triggers"
