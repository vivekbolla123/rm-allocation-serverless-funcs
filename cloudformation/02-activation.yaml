AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 2 - Activation Stack
  Activates the new RM Lambda functions by wiring all event triggers:
  1. SQS EventSourceMappings with batch size, batching window, and concurrency scaling.
  2. EventBridge Scheduler Schedules targeting new Lambdas.
  3. EventBridge Rules target activation (attaching -new-lambda targets and granting invoke permissions).

Parameters:
  Environment:
    Type: String
    AllowedValues: [uat, prod]
    Default: uat
    Description: Deployment target environment.

  ActivateSqs:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Whether to create SQS event source mappings.

  ActivateScheduler:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Whether to activate EventBridge Scheduler schedules (prod).

  ActivateEventBridgeRules:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Whether to add new targets to EventBridge rules.

  SchedulerExecutionRoleArn:
    Type: String
    Default: ''
    Description: IAM Role ARN for EventBridge Scheduler. If empty, a dedicated role is created.

  # SQS Queue ARNs (Configured per environment with defaults)
  QueueArnAdditiveProcess:
    Type: String
    Default: 'arn:aws:sqs:ap-south-1:471112573018:rm-additive-model'
    Description: SQS ARN for rm-additive-process (prod)

  QueueArnFetchInputs:
    Type: String
    Default: 'arn:aws:sqs:ap-south-1:891377165721:test-rm-allocation-queues-rm-allocation-fetch-inputs'
    Description: SQS ARN for rm-allocation-fetch-inputs

  QueueArnProcessInputs:
    Type: String
    Default: 'arn:aws:sqs:ap-south-1:891377165721:test-rm-allocation-queues-rm-allocation-market-list'
    Description: SQS ARN for rm-allocation-process-inputs

  QueueArnScheduledJobs:
    Type: String
    Default: 'arn:aws:sqs:ap-south-1:891377165721:test'
    Description: SQS ARN for rm-allocation-scheduled-jobs

  QueueArnUpdateRbd:
    Type: String
    Default: 'arn:aws:sqs:ap-south-1:891377165721:test-rm-allocation-queues-rm-allocation-rbds'
    Description: SQS ARN for rm-allocation-update-rbd

  QueueArnUpdateRbdFtp:
    Type: String
    Default: 'arn:aws:sqs:ap-south-1:891377165721:test-rm-allocation-queues-rm-allocation-rbds-ftp'
    Description: SQS ARN for rm-allocation-update-rbd-ftp

  QueueArnPricingTriggers:
    Type: String
    Default: 'arn:aws:sqs:ap-south-1:891377165721:rm-allocation-queues_rm-pricing-triggers'
    Description: SQS ARN for rm-pricing-triggers (uat)

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  IsUat: !Equals [!Ref Environment, 'uat']
  EnableUatSqs: !And
    - !Equals [!Ref Environment, 'uat']
    - !Equals [!Ref ActivateSqs, 'true']
  EnableProdSqs: !And
    - !Equals [!Ref Environment, 'prod']
    - !Equals [!Ref ActivateSqs, 'true']
  EnableScheduler: !And
    - !Equals [!Ref ActivateScheduler, 'true']
    - !Equals [!Ref Environment, 'prod']
  EnableEbRules: !Equals [!Ref ActivateEventBridgeRules, 'true']
  CreateSchedulerRole: !And
    - !Equals [!Ref ActivateScheduler, 'true']
    - !Equals [!Ref Environment, 'prod']
    - !Equals [!Ref SchedulerExecutionRoleArn, '']

Resources:
  # =========================================================================
  # Scheduler IAM Execution Role (Created if not provided)
  # =========================================================================
  DefaultSchedulerExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateSchedulerRole
    Properties:
      RoleName: !Sub "${Environment}-rm-scheduler-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [scheduler.amazonaws.com]
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['lambda:InvokeFunction']
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-rm-lambda-*"

  # =========================================================================
  # SQS Event Source Mappings - UAT
  # =========================================================================
  UatFetchInputsSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableUatSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:uat-rm-lambda-rm-allocation-fetch-inputs"
      EventSourceArn: !Ref QueueArnFetchInputs
      BatchSize: 1
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 10

  UatProcessInputsSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableUatSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:uat-rm-lambda-rm-allocation-process-inputs"
      EventSourceArn: !Ref QueueArnProcessInputs
      BatchSize: 1
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 600

  UatScheduledJobsSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableUatSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:uat-rm-lambda-rm-allocation-scheduled-jobs"
      EventSourceArn: !Ref QueueArnScheduledJobs
      BatchSize: 10
      Enabled: false
      ScalingConfig:
        MaximumConcurrency: 500

  UatUpdateRbdSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableUatSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:uat-rm-lambda-rm-allocation-update-rbd"
      EventSourceArn: !Ref QueueArnUpdateRbd
      BatchSize: 5
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 400

  UatUpdateRbdFtpSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableUatSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:uat-rm-lambda-rm-allocation-update-rbd-ftp"
      EventSourceArn: !Ref QueueArnUpdateRbdFtp
      BatchSize: 10
      Enabled: true

  UatPricingTriggersSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableUatSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:uat-rm-lambda-rm-pricing-triggers"
      EventSourceArn: !Ref QueueArnPricingTriggers
      BatchSize: 1
      Enabled: true

  # =========================================================================
  # SQS Event Source Mappings - PROD
  # =========================================================================
  ProdAdditiveProcessSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableProdSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-additive-process"
      EventSourceArn: !Ref QueueArnAdditiveProcess
      BatchSize: 1
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 60

  ProdFetchInputsSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableProdSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-fetch-inputs"
      EventSourceArn: !Ref QueueArnFetchInputs
      BatchSize: 1
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 10

  ProdProcessInputsSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableProdSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-process-inputs"
      EventSourceArn: !Ref QueueArnProcessInputs
      BatchSize: 10
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 300

  ProdScheduledJobsSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableProdSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
      EventSourceArn: !Ref QueueArnScheduledJobs
      BatchSize: 1
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 5

  ProdUpdateRbdSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableProdSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-update-rbd"
      EventSourceArn: !Ref QueueArnUpdateRbd
      BatchSize: 5
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 1000

  ProdUpdateRbdFtpSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: EnableProdSqs
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-update-rbd-ftp"
      EventSourceArn: !Ref QueueArnUpdateRbdFtp
      BatchSize: 2
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 10

  # =========================================================================
  # EventBridge Scheduler - PROD (9 Schedules)
  # =========================================================================
  ProdScheduleAdditivePrefetchDaily:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: rm-additive-schedule-daily-new-lambda
      GroupName: default
      State: ENABLED
      ScheduleExpression: "cron(30 8 * * ? *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "Additive prefetch daily schedule for prod-rm-lambda-rm-additive-prefetch"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-additive-prefetch"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"modules": {"additive_prefetch": 1}}'

  ProdScheduleQCcheck:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: QCcheck-new-lambda
      GroupName: default
      State: DISABLED
      ScheduleExpression: "cron(0 10 1 * ? *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "QCcheck schedule for prod-rm-lambda-rm-allocation-scheduled-jobs"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"modules\":{\"qc_fares_check\":1}}"}'

  ProdScheduleMlForecastScoreIntl:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: RMScheduleJob_ML_Forecast_Score_International-new-lambda
      GroupName: default
      State: ENABLED
      ScheduleExpression: "cron(30 8 * * ? *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "International ML forecast score calculation"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"modules\":{\"ml_forecast_score\":1,\"is_intl\":true}}"}'

  ProdScheduleDefaultMarketListRefresh0to60:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: RMScheduleJob_DefaultMarketListRefresh_0_60-new-lambda
      GroupName: default
      State: ENABLED
      ScheduleExpression: "cron(0 1 ? * 3,5,6 *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "Market list refresh for 0-60 day intervals"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"overrides\":{\"start_day\":0,\"end_day\":60}}"}'

  ProdScheduleQCprocess:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: QCprocess-new-lambda
      GroupName: default
      State: DISABLED
      ScheduleExpression: "cron(0 10 L * ? *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "QCprocess schedule for prod-rm-lambda-rm-allocation-scheduled-jobs"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"modules\":{\"gen_qc_fares_table\":1}}"}'

  ProdScheduleDefaultMarketListRefresh0to180:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: RMScheduleJob_DefaultMarketListRefresh_0_180-new-lambda
      GroupName: default
      State: ENABLED
      ScheduleExpression: "cron(0 1 ? * 2,4,7 *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "Market list refresh for 0-180 day intervals"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"overrides\":{\"start_day\":0,\"end_day\":180}}"}'

  ProdScheduleDefaultMarketListRefresh0to365:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: RMScheduleJob_DefaultMarketListRefresh_0_365-new-lambda
      GroupName: default
      State: ENABLED
      ScheduleExpression: "cron(0 2 ? * 1 *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "Market list refresh for 0-365 day intervals"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"overrides\":{\"start_day\":0,\"end_day\":365}}"}'

  ProdScheduleHoldBookingAlert:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: RMScheduleJob_HoldBookingAlert-new-lambda
      GroupName: default
      State: ENABLED
      ScheduleExpression: "rate(15 minutes)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "Hold booking alert monitor running every 15 minutes"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-allocation-scheduled-jobs"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"modules\":{\"hold_booking_alert\":1}}"}'

  ProdSchedulePricingTriggersSectorMonitor:
    Type: AWS::Scheduler::Schedule
    Condition: EnableScheduler
    Properties:
      Name: rm-pricing-triggers-sector-monitor-new-lambda
      GroupName: default
      State: ENABLED
      ScheduleExpression: "cron(0 10,13,17 * * ? *)"
      ScheduleExpressionTimezone: "Asia/Calcutta"
      FlexibleTimeWindow:
        Mode: "OFF"
      Description: "Sector monitor schedule for prod-rm-lambda-rm-pricing-triggers"
      Target:
        Arn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:prod-rm-lambda-rm-pricing-triggers"
        RoleArn: !If [CreateSchedulerRole, !GetAtt DefaultSchedulerExecutionRole.Arn, !Ref SchedulerExecutionRoleArn]
        Input: '{"body": "{\"modules\":{\"sector_monitor\":1}}"}'

  # =========================================================================
  # Custom Resource for EventBridge Rule Target Activation & Permissions
  # =========================================================================
  RuleActivationCustomRole:
    Type: AWS::IAM::Role
    Condition: EnableEbRules
    Properties:
      RoleName: !Sub "${Environment}-rm-eb-activation-handler-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ManageEventBridgeTargets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:DescribeRule
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*"
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:GetFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"

  RuleActivationFunction:
    Type: AWS::Lambda::Function
    Condition: EnableEbRules
    DependsOn: RuleActivationCustomRole
    Properties:
      FunctionName: !Sub "${Environment}-rm-eb-rule-activator"
      Handler: index.lambda_handler
      Role: !GetAtt RuleActivationCustomRole.Arn
      Runtime: python3.11
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request
          from botocore.exceptions import ClientError

          events = boto3.client('events')
          lam = boto3.client('lambda')

          def send_cfn_response(event, context, status, reason, physical_id=None, data=None):
              response_body = json.dumps({
                  'Status': status,
                  'Reason': reason or 'See CloudWatch Log Stream: ' + context.log_stream_name,
                  'PhysicalResourceId': physical_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }).encode('utf-8')
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=response_body,
                  headers={'content-type': '', 'content-length': str(len(response_body))},
                  method='PUT'
              )
              urllib.request.urlopen(req)

          def lambda_handler(event, context):
              print(f"RequestType: {event.get('RequestType')}")
              req_type = event.get('RequestType')
              env = event['ResourceProperties']['Environment']
              
              if req_type in ('Create', 'Update'):
                  try:
                      paginator = events.get_paginator('list_rules')
                      updated_count = 0
                      for page in paginator.paginate():
                          for rule in page.get('Rules', []):
                              rule_name = rule['Name']
                              try:
                                  targets = events.list_targets_by_rule(Rule=rule_name).get('Targets', [])
                              except Exception:
                                  continue
                              for t in targets:
                                  old_arn = t.get('Arn', '')
                                  if 'rm-allocation-serverless-funcs' in old_arn or 'uat-rm-additive' in old_arn:
                                      old_fn = old_arn.split(':function:')[-1]
                                      svc = old_fn.replace('rm-allocation-serverless-funcs_', '').replace('uat-rm-allocation-serverless-funcs-', '').replace('uat-', '')
                                      new_fn = f"{env}-rm-lambda-{svc}"
                                      new_arn = f"arn:aws:lambda:{boto3.Session().region_name}:{old_arn.split(':')[4]}:function:{new_fn}"
                                      
                                      new_target_id = f"{t.get('Id', 'target')}-new-lambda"
                                      new_target = dict(t)
                                      new_target['Id'] = new_target_id
                                      new_target['Arn'] = new_arn
                                      events.put_targets(Rule=rule_name, Targets=[new_target])
                                      
                                      try:
                                          lam.add_permission(
                                              FunctionName=new_fn,
                                              StatementId=f"{rule_name}-new-lambda",
                                              Action="lambda:InvokeFunction",
                                              Principal="events.amazonaws.com",
                                              SourceArn=rule['Arn']
                                          )
                                      except ClientError as ce:
                                          if ce.response['Error']['Code'] != 'ResourceConflictException':
                                              print(f"Permission warning: {ce}")
                                      updated_count += 1
                      send_cfn_response(event, context, 'SUCCESS', f'Activated {updated_count} rule targets', physical_id=f"{env}-eb-activator")
                  except Exception as ex:
                      print(f"Error activating rules: {ex}")
                      send_cfn_response(event, context, 'FAILED', str(ex))
              elif req_type == 'Delete':
                  send_cfn_response(event, context, 'SUCCESS', 'Cleaned up activation activator', physical_id=event.get('PhysicalResourceId'))

  TriggerRuleActivation:
    Type: Custom::EventBridgeRuleActivator
    Condition: EnableEbRules
    DependsOn: RuleActivationFunction
    Properties:
      ServiceToken: !GetAtt RuleActivationFunction.Arn
      Environment: !Ref Environment

Outputs:
  ActivatedEnvironment:
    Description: Environment activated
    Value: !Ref Environment
