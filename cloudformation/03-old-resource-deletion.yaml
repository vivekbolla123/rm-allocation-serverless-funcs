AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 3 - Old Resource Deletion Stack
  Safely retires legacy triggers and cleans up deprecated Lambda resources:
  1. Removes old-lambda targets from EventBridge rules (retaining -new-lambda targets).
  2. Retires original EventBridge Scheduler schedules (disabling or deleting).
  3. Deletes deprecated SQS event source mappings on legacy Lambda functions.
  4. Deletes legacy Lambda functions once triggers are safely cut over.
  Includes built-in pre-flight guardrails and DryRun safety controls.

Parameters:
  Environment:
    Type: String
    AllowedValues: [uat, prod]
    Default: uat
    Description: Environment to perform decommissioning on (uat or prod).

  DryRun:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Dry run mode. When true, scans and logs actions without modifying or deleting resources.

  SchedulerAction:
    Type: String
    AllowedValues: ['disable', 'delete']
    Default: 'disable'
    Description: Action for original EventBridge Scheduler schedules. 'disable' is reversible; 'delete' permanently removes.

  RemoveOldRuleTargets:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Whether to remove old Lambda targets from EventBridge rules.

  DeleteOldSqsMappings:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Whether to delete SQS event source mappings from old Lambda functions.

  DeleteOldLambdas:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Whether to permanently delete the old legacy Lambda functions. Set to true only after verification.

Resources:
  # =========================================================================
  # IAM Execution Role for Deletion Custodian
  # =========================================================================
  DeletionCustodianRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-rm-old-resource-deletion-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeletionPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:ListRules
                  - events:ListTargetsByRule
                  - events:RemoveTargets
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*"
              - Effect: Allow
                Action:
                  - scheduler:ListSchedules
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*"
              - Effect: Allow
                Action:
                  - lambda:ListEventSourceMappings
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetFunction
                  - lambda:DeleteFunction
                  - lambda:RemovePermission
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*"

  # =========================================================================
  # Deletion Custodian Lambda Function
  # =========================================================================
  DeletionCustodianFunction:
    Type: AWS::Lambda::Function
    DependsOn: DeletionCustodianRole
    Properties:
      FunctionName: !Sub "${Environment}-rm-old-resource-custodian"
      Handler: index.lambda_handler
      Role: !GetAtt DeletionCustodianRole.Arn
      Runtime: python3.11
      Timeout: 900
      MemorySize: 512
      Code:
        ZipFile: |
          import json
          import os
          import sys
          import urllib.request
          import boto3
          from botocore.exceptions import ClientError

          events = boto3.client('events')
          scheduler = boto3.client('scheduler')
          lam = boto3.client('lambda')

          SERVICES = [
              "rm-additive-process",
              "rm-additive-prefetch",
              "rm-allocation-fetch-inputs",
              "rm-allocation-prefetch-inputs",
              "rm-allocation-process-inputs",
              "rm-allocation-scheduled-jobs",
              "rm-allocation-update-rbd",
              "rm-allocation-update-rbd-ftp",
              "rm-pricing-triggers",
          ]

          def send_cfn_response(event, context, status, reason, physical_id=None, data=None):
              response_body = json.dumps({
                  'Status': status,
                  'Reason': reason or 'See CloudWatch logs: ' + context.log_stream_name,
                  'PhysicalResourceId': physical_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }).encode('utf-8')
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=response_body,
                  headers={'content-type': '', 'content-length': str(len(response_body))},
                  method='PUT'
              )
              urllib.request.urlopen(req)

          def get_old_lambda_name(env, service):
              if env == "prod":
                  return f"rm-allocation-serverless-funcs_{service}"
              if service in ("rm-additive-process", "rm-additive-prefetch"):
                  return f"uat-{service}"
              return f"uat-rm-allocation-serverless-funcs-{service}"

          def get_new_lambda_name(env, service):
              return f"{env}-rm-lambda-{service}"

          def lambda_handler(event, context):
              req_type = event.get('RequestType')
              props = event.get('ResourceProperties', {})
              env = props.get('Environment', 'uat').lower()
              dry_run = props.get('DryRun', 'true').lower() == 'true'
              sched_action = props.get('SchedulerAction', 'disable').lower()
              remove_rule_targets = props.get('RemoveOldRuleTargets', 'true').lower() == 'true'
              delete_sqs = props.get('DeleteOldSqsMappings', 'true').lower() == 'true'
              delete_lambdas = props.get('DeleteOldLambdas', 'false').lower() == 'true'

              print(f"=== Cutover Decommissioning | Env: {env} | DryRun: {dry_run} | Action: {sched_action} ===")

              if req_type in ('Create', 'Update'):
                  summary = {
                      'RulesCleaned': 0,
                      'SchedulesRetired': 0,
                      'SqsMappingsDeleted': 0,
                      'LambdasDeleted': 0,
                      'DryRun': dry_run
                  }
                  try:
                      old_lambdas = {get_old_lambda_name(env, s): get_new_lambda_name(env, s) for s in SERVICES}

                      # 1. EVENTBRIDGE RULES
                      if remove_rule_targets:
                          paginator = events.get_paginator('list_rules')
                          for page in paginator.paginate():
                              for rule in page.get('Rules', []):
                                  rname = rule['Name']
                                  targets = events.list_targets_by_rule(Rule=rname).get('Targets', [])
                                  new_targets = [t for t in targets if t.get('Id', '').endswith('-new-lambda')]
                                  old_targets_to_remove = []

                                  for t in targets:
                                      tarn = t.get('Arn', '')
                                      tid = t.get('Id', '')
                                      if any(old_name in tarn for old_name in old_lambdas):
                                          # Guard: only remove old if new target is present on this rule
                                          if new_targets:
                                              old_targets_to_remove.append(tid)

                                  if old_targets_to_remove:
                                      print(f"[RULE] {rname}: removing old targets {old_targets_to_remove} (DryRun={dry_run})")
                                      if not dry_run:
                                          events.remove_targets(Rule=rname, Ids=old_targets_to_remove)
                                      summary['RulesCleaned'] += len(old_targets_to_remove)

                      # 2. EVENTBRIDGE SCHEDULER
                      sched_paginator = scheduler.get_paginator('list_schedules')
                      for page in sched_paginator.paginate():
                          for s in page.get('Schedules', []):
                              sname = s['Name']
                              group = s.get('GroupName', 'default')
                              # If schedule is an original (not ending with -new-lambda) and has a matching -new-lambda schedule
                              if not sname.endswith('-new-lambda'):
                                  new_sname = f"{sname}-new-lambda"
                                  # Guard: check if new schedule exists
                                  try:
                                      scheduler.get_schedule(Name=new_sname, GroupName=group)
                                      new_exists = True
                                  except ClientError:
                                      new_exists = False

                                  if new_exists:
                                      print(f"[SCHEDULER] {sname}: {sched_action} original schedule (DryRun={dry_run})")
                                      if not dry_run:
                                          if sched_action == 'delete':
                                              scheduler.delete_schedule(Name=sname, GroupName=group)
                                          else:
                                              cur = scheduler.get_schedule(Name=sname, GroupName=group)
                                              if cur.get('State') != 'DISABLED':
                                                  scheduler.update_schedule(
                                                      Name=sname,
                                                      GroupName=group,
                                                      ScheduleExpression=cur['ScheduleExpression'],
                                                      FlexibleTimeWindow=cur['FlexibleTimeWindow'],
                                                      Target=cur['Target'],
                                                      State='DISABLED'
                                                  )
                                      summary['SchedulesRetired'] += 1

                      # 3. SQS EVENT SOURCE MAPPINGS ON OLD LAMBDAS
                      if delete_sqs:
                          for old_fn, new_fn in old_lambdas.items():
                              try:
                                  mappings = lam.list_event_source_mappings(FunctionName=old_fn).get('EventSourceMappings', [])
                                  for m in mappings:
                                      mid = m['UUID']
                                      print(f"[SQS] Old {old_fn} mapping {mid}: deleting (DryRun={dry_run})")
                                      if not dry_run:
                                          lam.delete_event_source_mapping(UUID=mid)
                                      summary['SqsMappingsDeleted'] += 1
                              except ClientError as ce:
                                  if ce.response['Error']['Code'] != 'ResourceNotFoundException':
                                      print(f"Error listing SQS mappings on {old_fn}: {ce}")

                      # 4. DELETE OLD LAMBDAS (ONLY IF EXPLICITLY ENABLED)
                      if delete_lambdas and not dry_run:
                          for old_fn in old_lambdas:
                              try:
                                  print(f"[LAMBDA] Deleting legacy function: {old_fn}")
                                  lam.delete_function(FunctionName=old_fn)
                                  summary['LambdasDeleted'] += 1
                              except ClientError as ce:
                                  if ce.response['Error']['Code'] != 'ResourceNotFoundException':
                                      print(f"Error deleting lambda {old_fn}: {ce}")

                      status_msg = f"Decommission run complete (DryRun={dry_run}): {json.dumps(summary)}"
                      print(status_msg)
                      send_cfn_response(event, context, 'SUCCESS', status_msg, physical_id=f"{env}-rm-custodian", data=summary)
                  except Exception as e:
                      print(f"Custodian execution failed: {e}")
                      send_cfn_response(event, context, 'FAILED', str(e))
              elif req_type == 'Delete':
                  send_cfn_response(event, context, 'SUCCESS', 'Deletion stack cleaned up', physical_id=event.get('PhysicalResourceId'))

  TriggerDecommissioning:
    Type: Custom::OldResourceCustodian
    DependsOn: DeletionCustodianFunction
    Properties:
      ServiceToken: !GetAtt DeletionCustodianFunction.Arn
      Environment: !Ref Environment
      DryRun: !Ref DryRun
      SchedulerAction: !Ref SchedulerAction
      RemoveOldRuleTargets: !Ref RemoveOldRuleTargets
      DeleteOldSqsMappings: !Ref DeleteOldSqsMappings
      DeleteOldLambdas: !Ref DeleteOldLambdas

Outputs:
  CustodianExecutionStatus:
    Description: Status of the old resource decommission process
    Value: !Sub "Environment: ${Environment} | DryRun: ${DryRun} | SchedulerAction: ${SchedulerAction}"
