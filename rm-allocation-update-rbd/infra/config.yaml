# Infrastructure-as-Code Configuration for rm-allocation-update-rbd
# Modify this file to update sizing, environment variables, or triggers.
# Run 'python infra.py --env <uat|prod> --plan' to preview changes.

version: '1.0'
service_name: rm-allocation-update-rbd
description: RBD update processor for RM dynamic allocation
defaults:
  memory: 2048
  timeout: 900
  ephemeral_storage: 4096
  dd_service: rm-update-rbd
  dd_version: latest
  log_retention_days: 30
environments:
  uat:
    account_id: '891377165721'
    region: ap-south-1
    execution_role_arn: arn:aws:iam::891377165721:role/lambda-execution-role
    lambda:
      name: uat-rm-lambda-rm-allocation-update-rbd
      image_uri: 891377165721.dkr.ecr.ap-south-1.amazonaws.com/uat-rm-ecr-rm-allocation-update-rbd:latest
      memory: 2048
      timeout: 900
      ephemeral_storage: 4096
      dd_service: rm-update-rbd
      dd_version: latest
      log_retention_days: 30
      env_vars: {}
    vpc:
      vpc_id: vpc-01452dce7b5b446e1
      subnets:
      - subnet-053e2b8d03017c388
      - subnet-0a05a901a38cd5672
      security_groups:
      - sg-087f8184f725ec3fe
    secrets:
      dd_api_key_ssm: /copilot/qp/uat/secrets/DD_API_KEY
    triggers:
      sqs:
        queue_name: test-rm-allocation-queues-rm-allocation-rbds
        batch_size: 5
        enabled: true
        max_concurrency: 400
        batching_window_seconds: 1
