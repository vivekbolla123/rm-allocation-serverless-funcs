version: '1.0'
service_name: rm-allocation-prefetch-inputs
description: Prefetch inputs service for RM dynamic allocation
defaults:
  memory: 2048
  timeout: 900
  ephemeral_storage: 4096
  dd_service: rm-prefetch-inputs
  dd_version: latest
  log_retention_days: 30
