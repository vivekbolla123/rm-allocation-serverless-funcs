          body:
            start_interval: 22
            end_interval: 90
            run_type: Scheduled
            update_navitaire_method: api
            market_list_table_name: market_list
            region_method: Domestic
      - name: uat-rm-day-schedule-rule-5
        schedule: cron(0 21 * * ? *)
        enabled: false
      - name: uat-rm-day-schedule-rule-6
        schedule: cron(0 21 ? * MON,FRI *)
        enabled: false
      - name: uat-rm-day-schedule-rule-7
        schedule: cron(0 21 ? * TUE,SAT *)
        enabled: false
      - name: uat-rm-day-schedule-rule-8
        schedule: cron(0 21 ? * SUN,WED *)
        enabled: false
      - name: uat-rm-day-schedule-rule-9
        schedule: cron(0 21 ? * THU *)
        enabled: false
