spring:
  application:
    name: rm-file-handler
  profiles:
    active: uat   # default, can override via ENV or JVM arg
  jpa:
    open-in-view: false

  # Spring Cloud AWS 3.x configuration
  cloud:
    aws:
      region:
        static: ap-south-1  # Change to your AWS region (e.g., us-east-1, ap-south-1, etc.)
      credentials:
        # Will use default AWS credentials chain:
        # 1. Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
        # 2. System properties
        # 3. ~/.aws/credentials file
        # 4. IAM role (if running in AWS)
        profile:
          name: default  # Or specify your AWS CLI profile name

logging:
  pattern:
    console: "[%thread] %-5level %logger{36} - %msg%n"
  level:
    org.mongodb.driver: WARN
    org.mongodb.driver.connection: WARN
    org.mongodb.driver.cluster: WARN

    org.apache.spark: ERROR
    org.apache.spark.sql: ERROR
    org.apache.spark.scheduler: ERROR
    org.apache.spark.storage: ERROR

    io.delta: ERROR
    org.apache.spark.sql.delta: ERROR

    org.apache.hadoop: ERROR
    org.apache.hadoop.fs.s3a: ERROR

    org.apache.parquet: ERROR
    parquet: ERROR

---
spring:
  config:
    activate:
      on-profile: uat
    import:
      # Spring Cloud AWS 3.x syntax for Parameter Store
      - "aws-parameterstore:/rm/uat/rm-allocation/"
      - "aws-parameterstore:/copilot/qp/uat/secrets/"

  cloud:
    aws:
      parameterstore:
        enabled: true
        # Region is inherited from spring.cloud.aws.region.static above

rm:
  db:
    host: "172.24.72.35"
    port: 27017
    username: "testuser"
    dbname: "qp_dw_rmalloc"
    auth-source: "admin"
  file-path: test/rm-admin/
  upload-path: test/rm-admin/upload/
  s3-bucket: uat-qp-applications
  env-lambda: uat-
  aws-account: 891377165721

